<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Carrito | Fierrero Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --border:#e5e5e5;
      --text:#111;
      --muted:#777;
      --primary:#000;
    }

    *{
      box-sizing:border-box;
      font-family:'Inter',sans-serif;
    }

    body{
      margin:0;
      padding:30px 15px;
      background:#fafafa;
      color:var(--text);
    }

    h1{
      font-size:22px;
      margin-bottom:20px;
    }

    /* CONTENEDOR */
    .cart-container{
      max-width:900px;
      margin:auto;
      background:#fff;
      border:1px solid var(--border);
      border-radius:16px;
      padding:24px;
    }

    /* ITEM */
    .item{
      display:grid;
      grid-template-columns:90px 1fr auto;
      gap:16px;
      align-items:center;
      padding:14px 0;
      border-bottom:1px solid var(--border);
    }

    .item img{
      width:90px;
      height:90px;
      object-fit:cover;
      border-radius:10px;
    }

    .item h3{
      font-size:14px;
      font-weight:500;
      margin:0 0 6px;
    }

    .price{
      font-weight:600;
      font-size:14px;
    }

    .item button{
      border:none;
      background:#f2f2f2;
      padding:8px 12px;
      border-radius:8px;
      cursor:pointer;
      font-size:13px;
    }

    .item button:hover{
      background:#000;
      color:#fff;
    }

    /* TOTAL */
    .total{
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-size:18px;
      margin-top:20px;
    }

    /* BOTONES */
    .actions{
      display:flex;
      gap:12px;
      margin-top:20px;
    }

    .btn{
      flex:1;
      text-align:center;
      padding:14px;
      border-radius:12px;
      font-weight:600;
      text-decoration:none;
      border:1px solid #000;
      color:#000;
    }

    .btn.primary{
      background:#000;
      color:#fff;
    }

    .btn.primary:hover{
      opacity:.9;
    }

    @media(max-width:600px){
      .item{
        grid-template-columns:70px 1fr auto;
      }
    }
  </style>
</head>

<body>

<div class="cart-container">

  <h1>🛒 Tu carrito</h1>

  <div id="lista-carrito"></div>

  <div class="total">
    <span>Total</span>
    <strong id="total">$0</strong>
  </div>

  <div class="actions">
    <a href="index.html" class="btn">Seguir comprando</a>
    <a href="finalizar.html" class="btn primary">Finalizar compra</a>
  </div>

</div>

<script src="js/cart.js"></script>
<script>
  mostrarCarrito();
</script>

</body>
</html>
