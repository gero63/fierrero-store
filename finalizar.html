<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Finalizar compra | Fierrero Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body{
      font-family:'Inter',sans-serif;
      background:#fafafa;
      padding:30px 15px;
    }

    .container{
      max-width:800px;
      margin:auto;
      background:#fff;
      border:1px solid #e5e5e5;
      border-radius:16px;
      padding:24px;
    }

    h1{
      font-size:22px;
      margin-bottom:20px;
    }

    label{
      display:block;
      font-size:13px;
      margin-bottom:6px;
      font-weight:500;
    }

    input{
      width:100%;
      padding:12px;
      margin-bottom:16px;
      border-radius:10px;
      border:1px solid #ddd;
      font-size:14px;
    }

    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
    }

    .resumen{
      border-top:1px solid #e5e5e5;
      padding-top:16px;
      margin-top:10px;
    }

    .total{
      display:flex;
      justify-content:space-between;
      font-size:18px;
      margin-bottom:20px;
    }

    button{
      width:100%;
      padding:16px;
      background:#000;
      color:#fff;
      border:none;
      border-radius:14px;
      font-size:15px;
      font-weight:600;
      cursor:pointer;
    }

    button:hover{
      opacity:.9;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Finalizar compra</h1>

  <form onsubmit="finalizarCompra(event)">

    <label>Nombre y apellido</label>
    <input type="text" id="nombre" required>

    <label>Teléfono</label>
    <input type="tel" id="telefono" required>

    <label>Email</label>
    <input type="email" id="email" required>

    <div class="row">
      <div>
        <label>Ciudad</label>
        <input type="text" id="ciudad" required>
      </div>
      <div>
        <label>Provincia</label>
        <input type="text" id="provincia" required>
      </div>
    </div>

    <label>Dirección</label>
    <input type="text" id="direccion" required>

    <div class="resumen">
      <div class="total">
        <span>Total a pagar</span>
        <strong id="total">$0</strong>
      </div>
    </div>

    <button type="submit">Pagar con Mercado Pago</button>

  </form>

</div>

<script src="js/cart.js"></script>

<script>
  // 1. Mostrar el total apenas carga la página
  // Usamos la función calcularTotal() que agregamos a cart.js
  document.getElementById("total").innerText =
    "$" + calcularTotal().toLocaleString();

  function finalizarCompra(e) {
    e.preventDefault(); // Evita que la página se recargue

    // Captura de datos del formulario
    const nombre = document.getElementById("nombre").value;
    const telefono = document.getElementById("telefono").value;
    const email = document.getElementById("email").value;
    const ciudad = document.getElementById("ciudad").value;
    const provincia = document.getElementById("provincia").value;
    const direccion = document.getElementById("direccion").value;

    const carrito = obtenerCarrito();
    const total = calcularTotal();

    if (carrito.length === 0) {
      alert("Tu carrito está vacío.");
      return;
    }

    // 2. Construir el detalle del pedido para WhatsApp
    let detalle = "";
    carrito.forEach(p => {
      detalle += `🛒 *${p.nombre}*\n   Talle: ${p.talle}\n   Cantidad: ${p.cantidad}\n   Subtotal: $${(p.precio * p.cantidad).toLocaleString()}\n\n`;
    });

    const mensaje = `
🛍️ *NUEVO PEDIDO - FIERRERO STORE*

👤 *DATOS DEL CLIENTE*
*Nombre:* ${nombre}
*Teléfono:* ${telefono}
*Email:* ${email}

📍 *DIRECCIÓN DE ENVÍO*
*Calle:* ${direccion}
*Ciudad:* ${ciudad}, ${provincia}

📦 *PRODUCTOS*
${detalle}
💰 *TOTAL A PAGAR: $${total.toLocaleString()}*

---------------------------------------
✅ _El cliente está siendo redirigido a Mercado Pago..._
`;

    // 3. ESTRATEGIA PARA EVITAR BLOQUEOS:
    // A. Abrimos WhatsApp en una pestaña nueva
    const urlWhatsapp = `https://wa.me/543492215273?text=${encodeURIComponent(mensaje)}`;
    window.open(urlWhatsapp, "_blank");

    // B. Redirigimos la ventana actual a Mercado Pago después de un breve delay
    // Esto asegura que el navegador no bloquee ninguna de las dos acciones
    setTimeout(() => {
      window.location.href = "https://link.mercadopago.com.ar/fierrerostore7482992";
    }, 1000); 
  }
</script>

</body>
</html>
